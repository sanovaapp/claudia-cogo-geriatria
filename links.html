<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="css/style.css">
  <style>
    .links-page {
      min-height: 100svh;
      display: grid; place-items: center;
      padding: clamp(2rem, 6vw, 4rem) 1.2rem 3rem;
      position: relative; overflow: hidden;
    }
    .links-page::before {
      content: ""; position: absolute; pointer-events: none;
      width: min(80vw, 560px); aspect-ratio: 800 / 923;
      right: -18%; top: -6%;
      background: url("assets/logo/simbolo-oliva.png") center / contain no-repeat;
      opacity: 0.05;
    }
    .links-card { width: 100%; max-width: 430px; text-align: center; position: relative; }
    .links-card__foto {
      width: 128px; height: 128px; border-radius: 50%;
      object-fit: cover; object-position: center 30%;
      margin-inline: auto; border: 3px solid var(--gold);
      box-shadow: var(--shadow);
    }
    .links-card__logo { width: min(280px, 74vw); height: auto; margin: 1.3rem auto .4rem; }
    .links-card__areas {
      font-size: .68rem; font-weight: 600; letter-spacing: .16em;
      text-transform: uppercase; color: var(--gold-deep); margin-bottom: .2rem;
    }
    .links-card__crm { font-size: .72rem; letter-spacing: .08em; color: var(--taupe); margin-bottom: 1.8rem; }
    .links-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .85rem; }
    .link-item {
      display: flex; align-items: center; gap: .8rem;
      background: var(--surface);
      border: 1px solid var(--taupe-soft);
      border-radius: 18px 18px 18px 6px;
      padding: 1rem 1.2rem; min-height: 62px;
      font-weight: 600; font-size: 1.02rem; color: var(--olive);
      text-decoration: none; box-shadow: var(--shadow);
      transition: transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
    }
    .link-item:hover { transform: translateY(-2px); border-color: var(--gold); color: var(--olive); box-shadow: var(--shadow-lg); }
    .link-item svg { width: 24px; height: 24px; flex: none; color: var(--gold-deep); }
    .link-item--wa svg { color: var(--wa-solid); }
    .link-item span { flex: 1; text-align: center; margin-right: 24px; }
    .links-rodape { margin-top: 2rem; font-size: .8rem; color: var(--taupe); }
    .links-rodape a { color: var(--gold-deep); text-decoration: none; }
  </style>
</head>
